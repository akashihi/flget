[project]
name = "flget"
version = "0.1.0"
description = "Local Flibusta mirror search tool"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Denis Chaplygin", email = "me@akashihi.org" }]
keywords = ["flibusta", "inpx", "ebook", "fb2", "library", "search", "tui", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "pyfiglet>=1.0.4,<2",
    "platformdirs>=4.3.6,<5",
    "typer>=0.27.2,<0.28",
    "tomlkit>=0.15.2,<0.16",
    "prompt_toolkit>=3.0.48,<4",
    "requests>=2.32.3,<3",
    "whoosh-reloaded>=2.7.5,<2.8",
    "rich>=14.2,<16",
    "textual>=8.2.8,<9",
    "textual-image[textual]>=0.14.1,<0.15",
    "humanize>=4.11.0,<5",
    "cyrtranslit>=1.1,<2",
    "Unidecode>=1.3,<2",
    "markdownify>=1.2.2,<2",
]

[project.urls]
Homepage = "https://github.com/akashihi/flget"
Source = "https://github.com/akashihi/flget"
Issues = "https://github.com/akashihi/flget/issues"

[project.scripts]
flget = "flget.flget:main"
fltui = "flget.fltui:main"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "codespell==2.4.3",
    "deptry>=0.25,<0.26",
    "pre-commit>=4",
    "textual-dev>=1.8.0,<2",
    "types-requests>=2.32.0.20241016,<3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.codespell]
ignore-words-list = "gost"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "ISC", "PIE", "T20", "RET", "SIM", "TID", "ARG", "PTH",
    "PL",
    "TRY", "PERF", "RUF",
    "S",
    "LOG", "G",      # logging correctness
]
ignore = [
    "E501",
    "ISC001",  # conflicts with ruff-format
    "TRY003",
    # Typer commands legitimately take many options.
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Typer derives the CLI flag from the parameter name/
"src/flget/flget.py" = ["A002"]
"src/flget/naming.py" = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src/flget"]
strict = true

# These ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["whoosh.*", "cyrtranslit.*", "unidecode.*", "pyfiglet.*"]
ignore_missing_imports = true

# whoosh's WrappingCollector is Any without stubs, and CancellableCollector
# must subclass it.
[[tool.mypy.overrides]]
module = "flget.index"
disallow_subclassing_any = false
