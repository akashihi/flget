[project]
name = "flget"
version = "0.1.0"
description = "Local Flibusta mirror search tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyfiglet>=0.8.post1,<0.9",
    "platformdirs>=4.3.6,<5",
    "typer==0.12.5",
    # typer 0.12.5 predates click 8.2's CLI-parsing changes; keep click compatible.
    "click>=8.0,<8.2",
    "tomlkit>=0.13.2,<0.14",
    "prompt_toolkit>=3.0.48,<4",
    "requests>=2.32.3,<3",
    "whoosh>=2.7.4,<3",
    "textual>=0.85.2,<0.86",
    "textual-image[textual]>=0.13.2,<0.14",
    "humanize>=4.11.0,<5",
    "cyrtranslit>=1.1,<2",
    "Unidecode>=1.3,<2",
    # pyfiglet 0.8.post1 imports pkg_resources at runtime but does not declare it;
    # provide it via setuptools <81 (81 dropped the bundled pkg_resources module).
    "setuptools>=70,<81",
    "markdownify>=1.2.2,<2",
]

[project.scripts]
flget = "flget.flget:main"
fltui = "flget.fltui:main"

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "codespell==2.4.3",
    "deptry>=0.25,<0.26",
    "pre-commit>=4",
    "textual-dev>=1.6.1,<2",
    "types-requests>=2.32.0.20241016,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.codespell]
ignore-words-list = "gost"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "ISC", "PIE", "T20", "RET", "SIM", "TID", "ARG", "PTH",
    "PL",
    "TRY", "PERF", "RUF",
    "S",
    "LOG", "G",      # logging correctness
]
ignore = [
    "E501",
    "ISC001",  # conflicts with ruff-format
    "TRY003",
    # Typer commands legitimately take many options.
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Typer derives the CLI flag from the parameter name/
"src/flget/flget.py" = ["A002"]
"src/flget/naming.py" = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src/flget"]
strict = true

# These ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["whoosh.*", "cyrtranslit.*", "unidecode.*", "pyfiglet.*"]
ignore_missing_imports = true

# whoosh's WrappingCollector is Any without stubs, and CancellableCollector
# must subclass it.
[[tool.mypy.overrides]]
module = "flget.index"
disallow_subclassing_any = false
